<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contactez Djaka Condé">
    <title>Contact | Djaka Condé</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <a href="#main-content" class="skip-link">Aller au contenu principal</a>

    <header class="site-header">
        <div class="container header-container">
            <a href="index.html" class="logo">Djaka<span>.Condé</span></a>
            <button class="nav-toggle" aria-label="Ouvrir le menu" aria-expanded="false">
                <span class="hamburger"></span>
            </button>
            <nav class="main-nav" id="navMenu">
                <a href="index.html">Accueil</a>
                <a href="about.html">À propos</a>
                <a href="projects.html">Projets</a>
                <a href="contact.html" class="active">Contact</a>
            </nav>
        </div>
    </header>  

    <main id="main-content" class="container page-padding center-content">
        <section class="contact-section centered-block">
            <h1 class="page-title">Me Contacter</h1>
            <p class="section-subtitle">Un projet ou une opportunité professionnelle ? Laissez-moi un message.</p>

            <div id="form-feedback" class="feedback-message" role="alert" aria-live="polite"></div>

            <form id="contact-form" class="contact-form centered-form" novalidate>
                <div class="form-group">
                    <label for="fullname">Nom & Prénom <span class="required">*</span></label>
                    <input type="text" id="fullname" name="fullname" required aria-required="true">
                    <span class="error-msg" id="fullname-error"></span>
                </div>

                <div class="form-group">
                    <label for="email">Adresse E-mail <span class="required">*</span></label>
                    <input type="email" id="email" name="email" required aria-required="true">
                    <span class="error-msg" id="email-error"></span>
                </div>

                <div class="form-group">
                    <label for="subject">Sujet <span class="required">*</span></label>
                    <input type="text" id="subject" name="subject" required aria-required="true">
                    <span class="error-msg" id="subject-error"></span>
                </div>

                <div class="form-group">
                    <label for="message">Message <span class="required">*</span></label>
                    <textarea id="message" name="message" rows="5" required aria-required="true"></textarea>
                    <span class="error-msg" id="message-error"></span>
                </div>

                <button type="submit" class="btn btn-primary btn-full">Envoyer le message</button>
            </form>
        </section>
    </main>

    <footer class="site-footer">
        <div class="container footer-container">
            <p>&copy; 2026 Djaka Condé. Tous droits réservés.</p>
        </div>
    </footer>

    <!-- Bouton flottant Retour à l'accueil -->
    <a href="index.html" class="back-to-home-floating" id="floatingHomeBtn" aria-label="Retourner à l'accueil">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
            <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
        <span>Accueil</span>
    </a>

    <script src="js/app.js"></script>
</body>

</html>
